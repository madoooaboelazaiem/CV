<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
{{OG}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE4; --paper:#FBF8F1; --wash:#E9E2D4; --line:#DCD3C2;
  --ink:#1F2440; --ink2:#474A61; --muted:#7D776C; --on-ink:#F6F1E6;
  --t1:#1F2440; --t2:#3A3D58; --t3:#6A6777; --t4:#9D958A; --t5:#CEC4B3; --t6:transparent;
  --t1f:#F6F1E6; --t2f:#F6F1E6; --t3f:#F6F1E6; --t4f:#1F2440; --t5f:#1F2440; --t6f:#1F2440;
  --good:#3E6B4E; --warn:#9A6A1E; --okI:#A7D9B5; --warnI:#F0C27A; --hx:#D4CAA4;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Inter Tight","Inter",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r-s:6px; --r-m:12px; --r-l:20px;
  --pad:clamp(20px,4vw,56px);
  --maxw:1320px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13162A; --paper:#1A1E36; --wash:#20253F; --line:#2D3250;
    --ink:#EFE8DA; --ink2:#C6BFB0; --muted:#8D899B; --on-ink:#13162A;
    --t1:#EFE8DA; --t2:#C9C1B1; --t3:#958FA0; --t4:#5F5D78; --t5:#353954; --t6:transparent;
    --t1f:#13162A; --t2f:#13162A; --t3f:#13162A; --t4f:#EFE8DA; --t5f:#EFE8DA; --t6f:#EFE8DA;
    --good:#8CC3A0; --warn:#E0B36A; --okI:#2F6B44; --warnI:#8A5A12; --hx:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13162A; --paper:#1A1E36; --wash:#20253F; --line:#2D3250;
  --ink:#EFE8DA; --ink2:#C6BFB0; --muted:#8D899B; --on-ink:#13162A;
  --t1:#EFE8DA; --t2:#C9C1B1; --t3:#958FA0; --t4:#5F5D78; --t5:#353954; --t6:transparent;
  --t1f:#13162A; --t2f:#13162A; --t3f:#13162A; --t4f:#EFE8DA; --t5f:#EFE8DA; --t6f:#EFE8DA;
  --good:#8CC3A0; --warn:#E0B36A; --okI:#2F6B44; --warnI:#8A5A12; --hx:#FFFFFF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus,.sr:focus-visible{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:auto;height:auto;overflow:visible;clip:auto;white-space:normal;background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:8px;z-index:100;text-decoration:none;font-size:.9rem}

/* ---------- type ---------- */
.display{font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.95;margin:0;font-size:clamp(2.6rem,7vw,5.6rem)}
.display em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--ink2);font-size:1.08em}
.kicker{display:flex;gap:.75rem;align-items:baseline;font-size:.8rem;color:var(--muted);margin:0 0 1.4rem;letter-spacing:.02em}
.kicker b{font-family:var(--display);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.lede{max-width:56ch;color:var(--ink2);font-size:1.02rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 1.15rem;border-radius:999px;font-weight:500;font-size:.92rem;text-decoration:none;border:1px solid var(--line);background:var(--paper);transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover{border-color:var(--ink)}
.btn--ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn--ink:hover{transform:translateY(-1px)}
.btn svg{width:16px;height:16px}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.is-scrolled{border-bottom-color:var(--line)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:12px var(--pad);display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.04em;font-size:1.05rem;text-decoration:none;white-space:nowrap}
.brand span{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;color:var(--muted)}
.nav-links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{flex:none;text-decoration:none;font-size:.86rem;padding:7px 13px;border-radius:999px;color:var(--ink2);transition:background .25s,color .25s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.is-active{background:var(--ink);color:var(--on-ink)}
.icon-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--paper)}
.icon-btn svg{width:17px;height:17px}
@media (min-width:900px){.nav-links{-webkit-mask-image:none}}
@media (max-width:640px){.brand-full{display:none}.nav-in{gap:10px}}

.monogram{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;letter-spacing:-.04em;font-size:.95rem;box-shadow:0 6px 24px -10px rgba(20,22,40,.5);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
.monogram.is-on{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:grid;align-items:end;overflow:hidden;padding:110px 0 clamp(28px,5vh,56px)}
.hero-water{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:clamp(7rem,27vw,30rem);letter-spacing:-.07em;line-height:.8;color:var(--ink);opacity:.045;white-space:nowrap;pointer-events:none;user-select:none;will-change:transform}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:var(--pad);align-items:end}
.hero-name{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 1.2rem;color:var(--ink2)}
.hero h1{font-family:var(--display);font-weight:800;letter-spacing:-.055em;line-height:.88;margin:0;font-size:clamp(3.3rem,9.6vw,9.4rem)}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .ln>span{display:inline-block}
.hero h1 .dot{color:var(--muted)}
.hero-sub{margin:1.6rem 0 0;font-size:clamp(1.02rem,1.6vw,1.2rem);color:var(--ink2);max-width:42ch}
.hero-sub em{font-family:var(--serif);font-size:1.18em;color:var(--ink)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:2rem}
.hero-fig{position:relative;margin:0;justify-self:end;width:min(100%,460px);aspect-ratio:429/504}
.hero-fig::before{content:"";position:absolute;inset:8% 6% 0;border-radius:999px 999px 0 0;background:var(--wash)}
.hero-fig img{position:relative;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:grayscale(1) contrast(1.15) brightness(.92);-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 64%);-webkit-mask-size:4px 4px;mask-image:radial-gradient(circle,#000 58%,transparent 64%);mask-size:4px 4px}
:root[data-theme="dark"] .hero-fig img{filter:grayscale(1) invert(.06) contrast(1.05) brightness(1.15)}
.hero-tag{position:absolute;left:-6%;bottom:12%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;font-size:.78rem;line-height:1.35;box-shadow:0 18px 40px -24px rgba(20,22,40,.45)}
.hero-tag b{display:block;font-family:var(--display);font-size:.92rem;letter-spacing:-.01em}
.hero-tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:860px){
  .hero{align-items:start;padding-top:96px}
  .hero-grid{grid-template-columns:1fr}
  .hero-fig{order:-1;justify-self:end;width:min(62vw,300px);margin-bottom:-8px}
  .hero-tag{left:auto;right:58%;bottom:8%}
  .hero-water{top:22%}
}

/* hero load sequence (the one orchestrated moment) */
.js .hero h1 .ln>span{transform:translateY(105%)}
.js .hero-name,.js .hero-sub,.js .hero-ctas,.js .hero-tag{opacity:0;transform:translateY(12px)}
.js .hero-fig{opacity:0;transform:translateY(24px)}
.is-loaded .hero h1 .ln>span{transform:none;transition:transform 1s cubic-bezier(.2,.8,.1,1)}
.is-loaded .hero h1 .ln:nth-child(2)>span{transition-delay:.1s}
.is-loaded .hero-name,.is-loaded .hero-sub,.is-loaded .hero-ctas,.is-loaded .hero-tag,.is-loaded .hero-fig{opacity:1;transform:none;transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.1,1)}
.is-loaded .hero-fig{transition-delay:.25s}
.is-loaded .hero-sub{transition-delay:.45s}
.is-loaded .hero-ctas{transition-delay:.55s}
.is-loaded .hero-tag{transition-delay:.9s}

/* ---------- sections ---------- */
.sec{padding:clamp(80px,12vw,150px) 0 0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1.2rem 2rem;margin-bottom:clamp(32px,5vw,56px)}
.sec-head .lede{margin:0;max-width:40ch}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,6vw,96px);align-items:start}
.about-copy p{margin:0 0 1.1rem;color:var(--ink2);max-width:58ch}
.about-copy p:first-of-type{font-size:clamp(1.12rem,1.6vw,1.3rem);color:var(--ink);line-height:1.5}
.about-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:1.6rem}
.idwrap{display:grid;gap:22px}
.idcard{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:0 30px 60px -40px rgba(20,22,40,.55);transform:rotate(-1.6deg);transition:transform .5s cubic-bezier(.2,.8,.1,1);max-width:420px}
.idcard:hover{transform:rotate(0)}
.idcard::before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:16px;margin-left:-27px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.id-top{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--muted);padding-bottom:14px;border-bottom:1px dashed var(--line)}
.id-top b{font-family:var(--display);color:var(--ink);font-size:.82rem;letter-spacing:-.01em}
.id-body{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 0}
.id-photo{width:96px;height:112px;border-radius:var(--r-m);object-fit:cover;background:var(--wash)}
.id-name{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.03em;line-height:1.05;margin:2px 0 4px}
.id-role{font-size:.84rem;color:var(--ink2);margin:0 0 10px;line-height:1.35}
.id-meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.74rem;margin:0}
.id-meta dt{color:var(--muted)}.id-meta dd{margin:0;font-weight:500}
.id-foot{display:flex;align-items:end;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}
.barcode{height:30px;flex:1;max-width:190px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.id-foot small{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
.facts{margin:0;display:grid;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.quote{font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1.25;margin:0;color:var(--ink)}
@media (max-width:860px){.about-grid{grid-template-columns:1fr}.idcard{transform:rotate(-1deg)}}

/* ---------- skills ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;font-size:.84rem;border:1px solid var(--line);background:var(--paper);transition:background .2s,color .2s,border-color .2s}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--ink);opacity:.8}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--on-ink)}
.skills-grid{display:grid;grid-template-columns:1fr 340px;gap:clamp(20px,3vw,40px);align-items:start}
.ptable{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.el{position:relative;aspect-ratio:1;border-radius:9px;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--tb);color:var(--tf);transition:opacity .35s,transform .25s,box-shadow .25s;min-width:0}
.el small{font-size:.58rem;opacity:.7;font-variant-numeric:tabular-nums;line-height:1}
.el strong{font-family:var(--display);font-weight:700;font-size:clamp(1rem,1.9vw,1.55rem);letter-spacing:-.04em;line-height:1}
.el span{font-size:.55rem;line-height:1.1;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el:hover{transform:translateY(-2px)}
.el.is-dim{opacity:.16}
.el.is-sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink);transform:scale(1.06);z-index:1}
.el[data-tier="6"]{border:1px dashed var(--line)}
.sdetail{position:sticky;top:96px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;min-height:340px}
.sd-big{width:150px;aspect-ratio:1;border-radius:16px;background:var(--ink);color:var(--on-ink);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:20px}
.sd-big small{font-size:.75rem;opacity:.7;font-variant-numeric:tabular-nums}
.sd-big strong{font-family:var(--display);font-size:4rem;font-weight:800;letter-spacing:-.06em;line-height:.9}
.sd-name{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;margin:0;line-height:1.1}
.sd-cat{font-size:.82rem;color:var(--muted);margin:4px 0 14px}
.sd-note{margin:0 0 14px;color:var(--ink2);font-size:.94rem}
.sd-used{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.sd-used li{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--wash)}
.legend{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:.78rem;color:var(--muted)}
.legend i{display:flex;gap:3px}.legend b{display:block;width:14px;height:14px;border-radius:3px}
@media (max-width:1000px){.skills-grid{grid-template-columns:1fr}.sdetail{position:relative;top:0;min-height:0;display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}.sd-big{width:110px;margin:0}.sd-big strong{font-size:2.8rem}}
@media (max-width:720px){.ptable{grid-template-columns:repeat(6,1fr);gap:5px}.el span{display:none}.el strong{font-size:1.15rem}}
@media (max-width:420px){.ptable{grid-template-columns:repeat(5,1fr)}}

/* ---------- work ---------- */
.stage{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;min-height:540px;box-shadow:0 40px 80px -60px rgba(20,22,40,.6)}
.pcard-copy{padding:clamp(22px,3.4vw,44px);display:flex;flex-direction:column}
.p-meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted);margin-bottom:22px}
.p-meta b{font-family:var(--display);font-size:2.4rem;line-height:.8;color:var(--ink);font-weight:800;letter-spacing:-.05em}
.p-title{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3vw,2.6rem);line-height:1;letter-spacing:-.04em;margin:0 0 6px}
.p-org{font-size:.86rem;color:var(--muted);margin:0 0 16px}
.p-desc{margin:0 0 16px;color:var(--ink2);font-size:.97rem}
.p-points{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:7px}
.p-points li{display:grid;grid-template-columns:18px 1fr;font-size:.9rem;line-height:1.45}
.p-points li::before{content:"";width:7px;height:7px;margin-top:.5em;border-radius:50%;background:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}
.tags li{font-size:.74rem;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink2)}
.p-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notes{margin-top:14px;border-top:1px solid var(--line);display:none}
.notes.is-open{display:block}
.notes dl{margin:0}
.notes div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.notes dt{color:var(--muted)}.notes dd{margin:0}
.pvis{background:var(--wash);position:relative;display:grid;place-items:center;padding:clamp(18px,3vw,40px);overflow:hidden}
.rail{display:flex;gap:8px}
.rail button{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-end;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:16px 10px;font-size:.8rem;display:flex;align-items:center;gap:10px;color:var(--ink2);transition:background .25s,color .25s;white-space:nowrap}
.rail button b{font-family:var(--display);font-weight:700;color:var(--ink)}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.rail button[aria-selected="true"] b{color:var(--on-ink)}
.work-ctrl{display:flex;align-items:center;gap:10px;margin-top:16px}
.work-ctrl span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto}
.pcard.is-swap{animation:swap .5s cubic-bezier(.2,.8,.1,1)}
@keyframes swap{from{opacity:0;transform:translateX(18px)}}
@media (max-width:1100px){.rail button{padding:14px 8px}.rail button .rl{display:none}}
@media (max-width:860px){.stage{grid-template-columns:1fr}.rail{order:-1;overflow-x:auto;scrollbar-width:none}.rail button{writing-mode:horizontal-tb;transform:none;flex:none;padding:8px 13px;border-radius:999px}.rail button .rl{display:inline}.pcard{grid-template-columns:1fr;min-height:0}.pvis{min-height:280px;order:-1}}

.side{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.side a{display:block;padding:18px 18px 18px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.side a:not(:last-child){border-right:1px solid var(--line)}
.side a+a{padding-left:18px}
.side b{display:block;font-family:var(--display);font-size:1.1rem;letter-spacing:-.02em}
.side small{color:var(--muted);font-size:.82rem}
.side-label{font-size:.82rem;color:var(--muted);margin:44px 0 0}
@media (max-width:720px){.side{grid-template-columns:1fr}.side a,.side a+a{padding:16px 0;border-right:0!important}}

/* mock visuals */

.id-bal{padding:0 0 12px}
.id-bal-h{font-size:.68rem;color:var(--muted);margin-bottom:5px}
.id-bal-bar{display:flex;gap:3px;height:8px}
.id-bal-bar i{border-radius:3px;background:var(--ink)}
.id-bal-bar i.b1{background:var(--t4)}.id-bal-bar i.b2{background:var(--t5)}
.id-bal-l{display:flex;gap:3px;font-size:.68rem;margin-top:4px;color:var(--ink2);font-weight:500}
.editor{position:fixed;z-index:70;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--paper);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:-30px 0 60px -40px rgba(20,22,40,.5)}
.ed-h{display:flex;justify-content:space-between;align-items:center}.ed-h b{font-family:var(--display);font-size:1.15rem;letter-spacing:-.02em}
.ed-h .icon-btn{font-size:1.3rem;line-height:1}
.ed-help{margin:0;font-size:.82rem;color:var(--ink2);line-height:1.45}
.editor textarea{flex:1;min-height:0;width:100%;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:12px;tab-size:2}
.ed-status{margin:0;font-size:.8rem}.ed-status.ok{color:var(--good)}.ed-status.err{color:var(--warn)}
.ed-bar{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:700px){.editor{top:auto;height:80svh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0}}
.editing .monogram{display:none}
</style>

<body>
<script>document.documentElement.classList.add('js');try{var t=localStorage.getItem('cv-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<script type="application/json" id="cv-content">{{CONTENT_JSON}}</script>

<a class="sr" href="#about">Skip to content</a>
<header class="nav" id="nav">
  <div class="nav-in">
    <a class="brand" href="#top" id="brand"></a>
    <nav class="nav-links" id="navLinks" aria-label="Sections"></nav>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch colour theme">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
    </button>
  </div>
</header>
<button class="monogram" id="mono" type="button" aria-label="Back to top"></button>

<main>
<section class="hero" id="top">
  <div class="hero-water" id="water" aria-hidden="true"></div>
  <canvas class="hero-under" id="under" aria-hidden="true"></canvas>
  <div class="wrap">
    <div class="hero-grid">
      <div class="hero-copy">
        <p class="hero-name" id="heroName"></p>
        <h1 id="heroTitle"></h1>
        <p class="hero-rot" id="heroRot"></p>
        <p class="hero-sub" id="heroSub"></p>
        <div class="hero-ctas" id="heroCtas"></div>
      </div>
      <figure class="hero-fig">
        <img src="{{PORTRAIT}}" alt="" id="heroImg" width="429" height="504" fetchpriority="high">
        <figcaption class="hero-tag" id="heroTag"></figcaption>
      </figure>
    </div>
  </div>
  <p class="hero-hint" id="hint" aria-hidden="true"><svg viewBox="0 0 42 14"><path d="M2 10 C 10 2, 16 2, 21 7 S 33 13, 40 4"/></svg><span></span></p>
</section>
<div class="marq" id="marq" aria-hidden="true"><div class="mrow" id="m1"></div><div class="mrow" id="m2"></div></div>

<section class="sec" id="about">
  <div class="wrap">
    <p class="kicker"></p>
    <div class="about-grid">
      <div class="about-copy">
        <h2 class="display" style="margin-bottom:2rem" data-h="about"></h2>
        <div id="aboutP"></div>
        <div class="about-links" id="aboutLinks"></div>
      </div>
      <div class="idwrap">
        <article class="idcard" id="idcard" aria-label="Engineer identity card"></article>
        <dl class="facts" id="facts"></dl>
        <p class="quote" id="quote"></p>
      </div>
    </div>
  </div>
</section>

<section class="sec" id="ai">
  <div class="wrap">
    <p class="kicker"></p>
    <div class="sec-head"><h2 class="display" data-h="ai"></h2><p class="lede" data-lede="ai"></p></div>
    <div class="ai-grid">
      <div>
        <div class="orch" id="orch">
          <div class="orch-h"><b>Multi-LLM orchestration</b><span>orchestrator → workers, live</span></div>
          <svg id="orchSvg" viewBox="0 0 380 300" role="img" aria-label="An orchestrator model sends subtasks to three worker models, checks the results, retries a failed one and returns a merged result."></svg>
          <div class="log" id="olog" aria-hidden="true"></div>
        </div>
        <div class="versus" id="versus">
          <div class="versus-h"><b>Waiting on a slow model call</b><span>same job, two designs</span></div>
          <div class="vlane"><div><b>Polling</b><small>ask again and again</small></div><div class="vtrack" id="vpoll"></div><div class="vcount"><span id="cpoll">0</span><small>requests</small></div></div>
          <div class="vlane"><div><b>Inngest workflow</b><small>wait for the event</small></div><div class="vtrack" id="vflow"><span class="vline"></span></div><div class="vcount"><span id="cflow">0</span><small>requests</small></div></div>
        </div>
      </div>
      <ul class="lrows pillars" id="pillars"></ul>
    </div>
  </div>
</section>

<section class="sec" id="skills">
  <div class="wrap">
    <p class="kicker"></p>
    <div class="sec-head"><h2 class="display" data-h="skills"></h2><p class="lede" data-lede="skills"></p></div>
    <div class="filters" id="filters" role="group" aria-label="Filter skills by group"></div>
    <div class="skills-grid">
      <div class="ptable" id="ptable"></div>
      <aside class="sdetail" id="sdetail" aria-live="polite"></aside>
    </div>
  </div>
</section>

<section class="sec" id="work">
  <div class="wrap">
    <p class="kicker"></p>
    <div class="sec-head"><h2 class="display" data-h="work"></h2><p class="lede" data-lede="work"></p></div>
    <div class="stage">
      <article class="pcard" id="pcard" aria-live="polite"></article>
      <div class="rail" id="rail" role="tablist" aria-label="Projects"></div>
    </div>
    <div class="work-ctrl">
      <span id="pcount"></span>
      <button class="icon-btn" id="pprev" type="button" aria-label="Previous project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
      <button class="icon-btn" id="pnext" type="button" aria-label="Next project"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </div>
    <p class="side-label" id="sideLabel"></p>
    <div class="side" id="side"></div>
  </div>
</section>

<section class="sec" id="systems">
  <div class="wrap">
    <p class="kicker"></p>
    <div class="sec-head"><h2 class="display" data-h="systems"></h2><p class="lede" data-lede="systems"></p></div>
    <div class="arch-tabs" id="archTabs" role="tablist" aria-label="Systems"></div>
    <div class="arch">
      <ol class="flow" id="flow"></ol>
      <aside class="adetail" id="adetail" aria-live="polite"></aside>
    </div>
  </div>
</section>

<section class="sec" id="experience">
  <div class="wrap">
    <p class="kicker"></p>
    <div class="sec-head"><h2 class="display" data-h="experience"></h2></div>
    <div class="years" id="years" role="tablist" aria-label="Timeline"></div>
    <div class="xp" id="xp" aria-live="polite"></div>
  </div>
</section>

<section class="sec" id="learning">
  <div class="wrap">
    <div class="learn">
      <div>
        <p class="kicker"></p>
        <h2 class="display" data-h="learning"></h2>
        <p class="lede" style="margin-top:1.4rem" data-lede="learning"></p>
      </div>
      <ul class="lrows" id="lrows"></ul>
    </div>
  </div>
</section>

<section class="sec" id="achievements">
  <div class="proud-pin" id="proudPin"><div class="proud-stick">
    <div class="wrap">
      <p class="kicker"></p>
      <div class="sec-head" style="margin-bottom:clamp(24px,3vw,40px)"><h2 class="display" data-h="achievements"></h2><p class="proud-hint" id="proudHint"></p></div>
    </div>
    <div class="wrap" style="max-width:none;padding:0"><div class="proud" id="proud" tabindex="0" aria-label="Achievements"></div></div>
    <div class="wrap"><div class="proud-bar"><i id="pbar"></i></div></div>
  </div></div>
</section>

<section class="contact" id="contact">
  <div class="wrap">
    <p class="kicker"></p>
    <h2 id="contactH"></h2>
    <a class="mail" id="mail" href="#"></a>
    <div class="c-links" id="cLinks"></div>
  </div>
</section>
</main>

<footer class="foot"><div class="wrap"><span id="footL"></span><span id="footR"></span></div></footer>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
'use strict';
var PRISTINE='<!DOCTYPE html>\n'+document.documentElement.outerHTML.replace(/^<html([^>]*)>/,function(m,a){return '<html'+a.replace(/\s(class="js"|data-theme="[^"]*")/g,'')+'>'});
var ASSETS={avatar:'{{AVATAR}}',card:'{{CARD}}',cv:'{{CV_B64}}',sketch:'{{SKETCH}}',sticker:'{{STICKER}}'};
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var RM=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var root=document.documentElement;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function md(s){return esc(s).replace(/\*([^*]+)\*/g,'<em>$1</em>')}
function pad(n){return String(n).padStart(2,'0')}
function wait(ms){return new Promise(function(r){setTimeout(r,ms)})}
function onView(el,cb,opt){if(!el)return;if(!('IntersectionObserver' in window)){cb(true,{unobserve:function(){}});return}var io=new IntersectionObserver(function(es){es.forEach(function(e){cb(e.isIntersecting,io)})},opt||{threshold:.2});io.observe(el);return io}
function head(a){a=a||[];return esc(a[0]||'')+(a[1]?' <em>'+esc(a[1])+'</em>':'')}
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var DOWN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 4v12M6 11l6 6 6-6M5 20h14"/></svg>';

/* ================= CONTENT ================= */
var EDIT=/(^|[#&?])edit\b/.test(location.hash+location.search);
var FILE_JSON=$('#cv-content').textContent,DRAFT=null,CONTENT;
if(EDIT){try{DRAFT=sessionStorage.getItem('cv-draft')}catch(e){}}
try{CONTENT=JSON.parse(DRAFT||FILE_JSON)}catch(e){DRAFT=null;try{CONTENT=JSON.parse(FILE_JSON)}catch(e2){CONTENT={}}}
var P=CONTENT.person||{},HAS_CV=!!ASSETS.cv&&ASSETS.cv.indexOf('{{')<0;
['avatar','card','cv','sketch','sticker'].forEach(function(k){if(ASSETS[k].indexOf('{{')===0)ASSETS[k]=''});

/* ================= RENDER ================= */
var ORDER=['about','ai','skills','work','systems','experience','learning','achievements','contact'];
ORDER.forEach(function(k){if(!CONTENT[k]){var el=document.getElementById(k);if(el)el.remove()}});
if(!document.querySelector('link[rel~="icon"]')&&P.monogram){var fv=document.createElement('link');fv.rel='icon';fv.type='image/svg+xml';
  fv.href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#1F2440"/><text x="32" y="43" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="30" text-anchor="middle" fill="#F6F1E6">'+esc(P.monogram.slice(0,2))+'</text></svg>');document.head.appendChild(fv)}
if(CONTENT.meta){if(CONTENT.meta.title)document.title=CONTENT.meta.title;if(CONTENT.meta.lang)root.lang=CONTENT.meta.lang}
var NAV=CONTENT.nav||{};
$('#brand').innerHTML=esc(P.monogram||'')+(P.brandSuffix?'<span class="brand-full"> <span>'+esc(P.brandSuffix)+'</span></span>':'');
$('#brand').setAttribute('aria-label',(P.name||'')+', back to top');
$('#mono').textContent=P.monogram||'';
$('#navLinks').innerHTML=ORDER.filter(function(k){return NAV[k]&&document.getElementById(k)}).map(function(k){return '<a href="#'+k+'">'+esc(NAV[k])+'</a>'}).join('');
var kn=0;ORDER.forEach(function(k){var sec=document.getElementById(k);if(!sec)return;var kk=$('.kicker',sec);if(kk){kn++;kk.innerHTML='<b>'+pad(kn)+'</b>'+esc(NAV[k]||(CONTENT[k]&&CONTENT[k].kicker)||k.charAt(0).toUpperCase()+k.slice(1))}});
$$('[data-h]').forEach(function(h){var c=CONTENT[h.dataset.h];if(c)h.innerHTML=head(c.heading)});
$$('[data-lede]').forEach(function(p){var c=CONTENT[p.dataset.lede];if(c&&c.lede)p.innerHTML=md(c.lede);else p.remove()});

var H=CONTENT.hero||{};
if($('#water'))$('#water').textContent=P.watermark||'';
$('#heroName').textContent=H.eyebrow||P.name||'';
var tl=H.titleLines||[];$('#heroTitle').innerHTML=tl.map(function(l,i){return '<span class="ln"><span>'+esc(l)+(i===tl.length-1?'<span class="dot">.</span>':'')+'</span></span>'}).join('');
var rw=H.rotWords||[];
$('#heroRot').innerHTML=(H.role?'<span class="role">'+esc(H.role)+'</span><br>':'')+(rw.length?esc(H.rotPrefix||'')+' <span class="rot" id="rot">'+rw.map(function(w,i){return '<span'+(i?'':' class="on"')+'>'+esc(w)+'</span>'}).join('')+'</span>':'');
$('#heroSub').innerHTML=md(H.sub||'');
$('#heroCtas').innerHTML=(CONTENT.work?'<a class="btn btn--ink" href="#work">'+esc(H.ctaWork||'Explore work')+' '+ARROW+'</a>':'')+
  '<a class="btn" href="#contact">'+esc(H.ctaTalk||"Let's talk")+' '+ARROW+'</a>'+
  (HAS_CV?'<button class="btn" type="button" data-resume>'+esc(H.ctaResume||'Résumé')+' '+DOWN+'</button>':'');
if($('#heroImg'))$('#heroImg').alt='Portrait of '+(P.name||'');
if(H.current&&$('#heroTag'))$('#heroTag').innerHTML='<i></i>'+esc(H.currentLabel||'Currently')+'<b>'+esc(H.current)+'</b>';else if($('#heroTag'))$('#heroTag').remove();

  var I=A.idCard;
  if(I){
    var bal=I.balance&&I.balance.length?'<div class="id-bal"><div class="id-bal-h"><span>'+esc(I.balanceLabel||'')+'</span></div><div class="id-bal-bar">'+I.balance.map(function(b,i){return '<i style="flex:'+(+b[1]||1)+'" class="b'+i+'"></i>'}).join('')+'</div><div class="id-bal-l">'+I.balance.map(function(b){return '<span style="flex:'+(+b[1]||1)+'">'+esc(b[0])+'</span>'}).join('')+'</div></div>':'';

      '<div><p class="id-name">'+(I.nameLines||[P.name]).map(esc).join('<br>')+'</p><p class="id-role">'+esc(I.role||'')+'</p><dl class="id-meta">'+(I.meta||[]).map(function(m){return '<dt>'+esc(m[0])+'</dt><dd>'+esc(m[1])+'</dd>'}).join('')+'</dl></div></div>'+

  if(A.quote)$('#quote').textContent='“'+A.quote+'”';else $('#quote').remove();
}
var F=CONTENT.footer||{};$('#footL').textContent=F.left||'';$('#footR').textContent=F.right||'';
var CT=CONTENT.contact;
if(CT){var ch=CT.heading||[];$('#contactH').innerHTML=esc(ch[0]||'')+(ch[1]?'<span class="c2">'+esc(ch[1])+'<span class="dot">.</span></span>':'');
  if(P.email){$('#mail').href='mailto:'+P.email;$('#mail').textContent=P.email}else $('#mail').remove();
  $('#cLinks').innerHTML=(P.email?'<a class="btn btn--ink" href="mailto:'+esc(P.email)+'">'+esc(CT.emailCta||'Email me')+'</a>':'')+
    (P.links||[]).map(function(l){return '<a class="btn" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(l.label)+'</a>'}).join('')+
    (HAS_CV?'<button class="btn" type="button" data-resume>'+esc(CT.resumeLabel||'Résumé (PDF)')+'</button>':'');
}

/* ================= THEME ================= */
$('#themeBtn').addEventListener('click',function(){
  var cur=root.getAttribute('data-theme')||((window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light');
  var next=cur==='dark'?'light':'dark';root.setAttribute('data-theme',next);
  try{localStorage.setItem('cv-theme',next)}catch(e){}
});
function inkColor(){return getComputedStyle(root).getPropertyValue('--ink').trim()||'#1F2440'}

/* ================= NAV ================= */
var nav=$('#nav'),mono=$('#mono'),water=$('#water');
var links=$$('.nav-links a');
var secMap={};ORDER.forEach(function(k){if(document.getElementById(k))secMap[k]=NAV[k]?k:(k==='learning'?'experience':k)});
if('IntersectionObserver' in window){
  var nio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){var id=secMap[e.target.id]||'';
    links.forEach(function(a){var on=a.getAttribute('href')==='#'+id;a.classList.toggle('is-active',on);if(on&&window.innerWidth<900){var p=a.parentNode;p.scrollTo({left:a.offsetLeft-p.clientWidth/2+a.clientWidth/2,behavior:'smooth'})}})}})},{rootMargin:'-45% 0px -50% 0px'});
  Object.keys(secMap).concat(['top']).forEach(function(id){var el=document.getElementById(id);if(el)nio.observe(el)});
}
mono.addEventListener('click',function(){window.scrollTo({top:0,behavior:RM?'auto':'smooth'})});

/* ================= ROTATING WORD ================= */
(function(){var rot=$('#rot');if(!rot||RM)return;var w=$$('span',rot),i=0;if(w.length<2)return;
  setInterval(function(){var a=w[i];i=(i+1)%w.length;var b=w[i];a.classList.remove('on');a.classList.add('out');b.classList.remove('out');b.style.transition='none';b.style.transform='translateY(110%)';void b.offsetWidth;b.style.transition='';b.style.transform='';b.classList.add('on');setTimeout(function(){a.classList.remove('out')},800)},2200);
})();

var VIS={
 pay:function(){
  var lanes=[['Instant',40],['SEPA',86],['SWIFT',132]],s='';
  lanes.forEach(function(l,i){s+='<path class="s" stroke-width="1" opacity=".25" d="M64 '+l[1]+' H246"/>'+
    '<rect x="132" y="'+(l[1]-9)+'" width="48" height="18" rx="4" fill="none" class="s" stroke-width="1" opacity=".5"/><path class="s" stroke-width="1" opacity=".35" d="M144 '+(l[1]-9)+'v18M156 '+(l[1]-9)+'v18M168 '+(l[1]-9)+'v18"/>'+
    '<text class="b" x="252" y="'+(l[1]+4)+'">'+l[0]+'</text>';
    for(var k=0;k<3;k++)s+='<circle r="3.6" class="f"><animateMotion dur="'+(2.2+i*.35)+'s" begin="'+(k*.75+i*.2)+'s" repeatCount="indefinite" path="M64 '+l[1]+' H246"/></circle>';
  });
  s+='<path class="s" stroke-width="1" opacity=".3" stroke-dasharray="3 3" d="M180 86 V160 H210"/><circle r="4" class="w"><animateMotion dur="3.4s" begin="1s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.15;.6;1" calcMode="linear" path="M64 86 H180 V160 H210"/></circle><text x="216" y="164">isolated</text>';
  return '<div class="mock"><div class="mock-h"><b>Payment messaging</b><span>queues per rail</span></div>'+
  '<svg class="vis-svg lanes" viewBox="0 0 310 176" aria-hidden="true"><rect x="10" y="22" width="54" height="128" rx="8" class="s" stroke-width="1" fill="none" opacity=".5"/><text class="b" x="37" y="84" text-anchor="middle">gRPC</text><text x="37" y="98" text-anchor="middle">services</text>'+s+'</svg>'+
  '<div class="big2" style="font-size:2rem;margin:6px 0 8px"><s>92%</s>99%</div><div class="meter"><i class="a"></i><i class="b"></i></div>'+

XP.forEach(function(x,i){var b=document.createElement('button');b.type='button';b.className='yr';b.setAttribute('role','tab');b.innerHTML='<b>'+esc(x.year)+'</b><small>'+esc(x.label||x.org)+'</small>';b.addEventListener('click',function(){showXp(i)});yrs.appendChild(b)});
function showXp(i){if(!XP.length)return;xi=(i+XP.length)%XP.length;var x=XP[xi],pts=x.points||[],tg=x.tags||[];
  $$('.yr',yrs).forEach(function(b,j){b.setAttribute('aria-selected',j===xi)});
  xp.innerHTML='<div><p class="xp-year" id="xpYear">'+esc(x.year)+'</p><p class="xp-range">'+esc(x.period||'')+'<br>'+esc(x.place||'')+'</p>'+(x.kind?'<span class="xp-kind">'+esc(x.kind)+'</span>':'')+'</div>'+
   '<div class="xp-body"><h3 class="xp-role">'+esc(x.role)+'</h3><p class="xp-org"><b>'+esc(x.org)+'</b></p><p class="xp-sum">'+md(x.summary||'')+'</p>'+
   (pts.length?'<ul class="pts">'+pts.map(function(p){return '<li>'+esc(p)+'</li>'}).join('')+'</ul>':'')+
   (tg.length?'<ul class="tags">'+tg.map(function(t){return '<li>'+esc(t)+'</li>'}).join('')+'</ul>':'')+
   '<div class="xp-nav"><button class="icon-btn" type="button" data-xp="-1" aria-label="Newer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="icon-btn" type="button" data-xp="1" aria-label="Older">'+ARROW+'</button></div></div>';
  if(!RM){$('.xp-body',xp).classList.add('is-swap');var yEl=$('#xpYear');yEl.animate&&yEl.animate([{transform:'translateY(40%)',opacity:0},{transform:'none',opacity:1}],{duration:700,easing:'cubic-bezier(.2,.8,.1,1)'})}
  var sel=yrs.children[xi];if(sel)yrs.scrollTo({left:sel.offsetLeft-yrs.clientWidth/3,behavior:'smooth'});
}
xp.addEventListener('click',function(e){var b=e.target.closest('[data-xp]');if(b)showXp(xi+(+b.dataset.xp))});
showXp(0);
})()}

/* ================= LEARNING ================= */
if(CONTENT.learning){$('#lrows').innerHTML=(CONTENT.learning.items||[]).map(function(l,i){return '<li class="lrow" tabindex="0"><small>'+pad(i+1)+'</small><div><b>'+esc(l.title)+'</b><span>'+esc(l.detail||'')+'</span></div><em>'+esc(l.when||'')+'</em></li>'}).join('')}

/* ================= ACHIEVEMENTS (pinned horizontal) ================= */
var proud=$('#proud'),pinWrap=$('#proudPin'),pbar=$('#pbar'),pinDist=0,cards=[];
function pinUpdate(){if(!proud||!root.classList.contains('pin-on'))return;var r=pinWrap.getBoundingClientRect(),span=pinWrap.offsetHeight-window.innerHeight,p=span>0?Math.min(1,Math.max(0,-r.top/span)):0;
  proud.style.transform='translate3d('+(-p*pinDist)+'px,0,0)';pbar.style.width=(p*100)+'%';
  var vw=window.innerWidth;cards.forEach(function(c){var b=c.getBoundingClientRect(),k=((b.left+b.width/2)/vw-.5);c.style.transform='translateY('+(Math.abs(k)*26)+'px) rotate('+(k*5)+'deg)'})}
function pinSetup(){if(!proud)return;var on=!RM&&window.innerWidth>=900&&cards.length>3;root.classList.toggle('pin-on',on);
  if(!on){pinWrap.style.height='';proud.style.transform='';cards.forEach(function(c){c.style.transform=''});return}
  pinDist=Math.max(0,proud.scrollWidth-window.innerWidth);pinWrap.style.height=(window.innerHeight+pinDist)+'px';pinUpdate()}
if(proud&&CONTENT.achievements){
  var AC=CONTENT.achievements;$('#proudHint').textContent=AC.hint||'';
  proud.innerHTML=(AC.items||[]).map(function(p,i){var num=p.big?'<span>'+esc(p.big)+'</span>':(p.prefix?'<small>'+esc(p.prefix)+'</small>':'')+'<span data-n="'+(+p.value||0)+'">'+(RM?(+p.value||0):0)+'</span>'+esc(p.suffix||'');
    return '<article class="pc"><div class="pc-org"><span>'+esc(p.org||'')+'</span><span>'+pad(i+1)+'</span></div><p class="pc-num" aria-label="'+esc(p.big||((p.prefix||'')+p.value+(p.suffix||'')))+'">'+num+'</p><p class="pc-what">'+esc(p.title)+'</p><p class="pc-ctx">'+esc(p.detail||'')+'</p></article>'}).join('');
  cards=$$('.pc',proud);
  var countUp=function(el){var to=+el.dataset.n,t0=null,d=1100;function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)};
  if(!RM&&'IntersectionObserver' in window){var cio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){countUp(e.target);cio.unobserve(e.target)}})},{threshold:.6});$$('[data-n]',proud).forEach(function(el){cio.observe(el)})}
  else{$$('[data-n]',proud).forEach(function(el){el.textContent=el.dataset.n})}
  var pt2;window.addEventListener('resize',function(){clearTimeout(pt2);pt2=setTimeout(pinSetup,150)});
}else proud=null;

/* ================= FILE SAVING ================= */
var toast=$('#toast'),tt;
function say(m){toast.textContent=m;toast.classList.add('is-on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('is-on')},2800)}
function b64bytes(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function blobSave(name,data,type){var url=URL.createObjectURL(new Blob([data],{type:type}));var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000)}
function saveFile(name,data,type,done){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){blobSave(name,data,type);if(done)done();return}
  c.use('downloads').then(function(dl){
    if(!dl){blobSave(name,data,type);if(done)done();return}
    return dl.save({filename:name,data:data}).then(function(){say('Saved '+name);if(done)done()},function(err){var code=err&&err.code;if(code==='declined')return;if(code==='rate_limited'){say('A save prompt is already open');return}say('Saving isn’t available here.')});
  },function(){blobSave(name,data,type)});
}
$$('[data-resume]').forEach(function(b){b.addEventListener('click',function(){
  try{saveFile(P.resumeFilename||'resume.pdf',b64bytes(ASSETS.cv),'application/pdf')}catch(e){if(P.email)location.href='mailto:'+P.email}
})});

/* ================= EDITOR (#edit) ================= */
function exportHtml(obj,cb){
  var json=JSON.stringify(obj,null,2).replace(/<\//g,'<\\/');
  function swap(src){var open='<script type="application/json" id="cv-content">',i=src.indexOf(open);if(i<0)return null;var j=src.indexOf('</'+'script>',i);
    var out=src.slice(0,i+open.length)+json+src.slice(j);var m=obj.meta||{};
    var rp=function(re,v){out=out.replace(re,function(x,p1,p2){return p1+v+p2})};
    if(m.title){rp(/(<title>)[\s\S]*?(<\/title>)/,esc(m.title));rp(/(<meta property="og:title" content=")[^"]*(">)/,esc(m.title))}
    if(m.description){rp(/(<meta name="description" content=")[^"]*(">)/,esc(m.description));rp(/(<meta property="og:description" content=")[^"]*(">)/,esc(m.description))}
    return out}
  var fallback=function(){cb(swap(PRISTINE))};
  if(/^https?:/.test(location.protocol)&&window.fetch){fetch(location.href.split('#')[0],{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){var o=t&&t.indexOf('id="cv-content"')>0?swap(t):null;if(o)cb(o);else fallback()},fallback)}else fallback();
}
function openEditor(){
  if($('#cvEditor'))return;
  var d=document.createElement('aside');d.id='cvEditor';d.className='editor';d.setAttribute('aria-label','Content editor');
  d.innerHTML='<div class="ed-h"><b>Edit content</b><button class="icon-btn" type="button" data-ed="close" aria-label="Close editor">×</button></div>'+
   '<p class="ed-help">Everything on the page comes from this JSON. Edit, press <b>Preview</b> to see it, then <b>Download index.html</b> and upload that file to your host. Delete a section’s key to hide it.</p>'+
   '<textarea spellcheck="false" aria-label="Site content JSON"></textarea>'+
   '<p class="ed-status" role="status"></p>'+
   '<div class="ed-bar"><button class="btn btn--ink" type="button" data-ed="preview">Preview</button><button class="btn" type="button" data-ed="download">Download index.html</button><button class="btn" type="button" data-ed="copy">Copy JSON</button><button class="btn" type="button" data-ed="reset">Discard draft</button></div>';
  document.body.appendChild(d);root.classList.add('editing');
  var ta=$('textarea',d),st=$('.ed-status',d);
  ta.value=JSON.stringify(CONTENT,null,2);
  function check(){try{var o=JSON.parse(ta.value);st.className='ed-status ok';st.textContent=DRAFT?'Valid JSON. Previewing an unsaved draft.':'Valid JSON.';return o}catch(e){st.className='ed-status err';st.textContent='JSON error: '+e.message;return null}}
  check();ta.addEventListener('input',check);
  ta.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end')}});
  d.addEventListener('click',function(e){var b=e.target.closest('[data-ed]');if(!b)return;var a=b.dataset.ed,o;
    if(a==='close'){d.remove();root.classList.remove('editing');history.replaceState(null,'',location.pathname+location.search.replace(/[?&]edit\b/,''));return}
    if(a==='reset'){try{sessionStorage.removeItem('cv-draft')}catch(x){}location.reload();return}
    o=check();if(!o)return;
    if(a==='preview'){try{sessionStorage.setItem('cv-draft',JSON.stringify(o))}catch(x){}location.reload()}
    if(a==='copy'){(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(o,null,2)):Promise.reject()).then(function(){say('JSON copied')},function(){ta.select();say('Select all and copy')})}
    if(a==='download'){exportHtml(o,function(html){if(!html){say('Could not build the file.');return}saveFile('index.html',html,'text/html')})}
  });
}
if(EDIT)openEditor();
window.addEventListener('hashchange',function(){if(/edit\b/.test(location.hash))openEditor()});

/* ================= LOAD ================= */
function go(){requestAnimationFrame(function(){root.classList.add('is-loaded');pinSetup();onScroll()})}
if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,900)})]).then(go)}else go();
onScroll();
})();
</script>
