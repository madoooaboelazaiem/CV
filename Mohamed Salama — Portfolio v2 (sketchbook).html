<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohamed Salama — Senior Software Engineer, Full-stack</title>
<!-- theme: sketchbook -->
<meta name="description" content="Mohamed Salama, Senior Software Engineer (full-stack, backend-first) and tech lead in Brussels. Distributed payment systems, FinTech and AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700;800&family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&family=Anton&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EEE4; --paper:#FBF8F1; --wash:#E9E2D4; --line:#DCD3C2;
  --ink:#1F2440; --ink2:#474A61; --muted:#7D776C; --on-ink:#F6F1E6;
  --t1:#1F2440; --t2:#3A3D58; --t3:#6A6777; --t4:#9D958A; --t5:#CEC4B3; --t6:transparent;
  --t1f:#F6F1E6; --t2f:#F6F1E6; --t3f:#F6F1E6; --t4f:#1F2440; --t5f:#1F2440; --t6f:#1F2440;
  --good:#3E6B4E; --warn:#9A6A1E; --okI:#A7D9B5; --warnI:#F0C27A; --hx:#D4CAA4;
  --sans:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --display:"Inter Tight","Inter",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --serif:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --r-s:6px; --r-m:12px; --r-l:20px;
  --pad:clamp(20px,4vw,56px);
  --maxw:1320px;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13162A; --paper:#1A1E36; --wash:#20253F; --line:#2D3250;
    --ink:#EFE8DA; --ink2:#C6BFB0; --muted:#8D899B; --on-ink:#13162A;
    --t1:#EFE8DA; --t2:#C9C1B1; --t3:#958FA0; --t4:#5F5D78; --t5:#353954; --t6:transparent;
    --t1f:#13162A; --t2f:#13162A; --t3f:#13162A; --t4f:#EFE8DA; --t5f:#EFE8DA; --t6f:#EFE8DA;
    --good:#8CC3A0; --warn:#E0B36A; --okI:#2F6B44; --warnI:#8A5A12; --hx:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13162A; --paper:#1A1E36; --wash:#20253F; --line:#2D3250;
  --ink:#EFE8DA; --ink2:#C6BFB0; --muted:#8D899B; --on-ink:#13162A;
  --t1:#EFE8DA; --t2:#C9C1B1; --t3:#958FA0; --t4:#5F5D78; --t5:#353954; --t6:transparent;
  --t1f:#13162A; --t2f:#13162A; --t3f:#13162A; --t4f:#EFE8DA; --t5f:#EFE8DA; --t6f:#EFE8DA;
  --good:#8CC3A0; --warn:#E0B36A; --okI:#2F6B44; --warnI:#8A5A12; --hx:#FFFFFF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .4s,color .4s}
img{max-width:100%;display:block}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- type ---------- */
.display{font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.95;margin:0;font-size:clamp(2.6rem,7vw,5.6rem)}
.display em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--ink2);font-size:1.08em}
.kicker{display:flex;gap:.75rem;align-items:baseline;font-size:.8rem;color:var(--muted);margin:0 0 1.4rem;letter-spacing:.02em}
.kicker b{font-family:var(--display);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.lede{max-width:56ch;color:var(--ink2);font-size:1.02rem}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:.5rem;height:44px;padding:0 1.15rem;border-radius:999px;font-weight:500;font-size:.92rem;text-decoration:none;border:1px solid var(--line);background:var(--paper);transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover{border-color:var(--ink)}
.btn--ink{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn--ink:hover{transform:translateY(-1px)}
.btn svg{width:16px;height:16px}

/* ---------- nav ---------- */
.nav{position:fixed;inset:0 0 auto 0;z-index:40;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s}
.nav.is-scrolled{border-bottom-color:var(--line)}
.nav-in{max-width:var(--maxw);margin:0 auto;padding:12px var(--pad);display:flex;align-items:center;gap:16px}
.brand{font-family:var(--display);font-weight:800;letter-spacing:-.04em;font-size:1.05rem;text-decoration:none;white-space:nowrap}
.brand span{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;color:var(--muted)}
.nav-links{display:flex;gap:2px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent)}
.nav-links::-webkit-scrollbar{display:none}
.nav-links a{flex:none;text-decoration:none;font-size:.86rem;padding:7px 13px;border-radius:999px;color:var(--ink2);transition:background .25s,color .25s}
.nav-links a:hover{color:var(--ink)}
.nav-links a.is-active{background:var(--ink);color:var(--on-ink)}
.icon-btn{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;background:var(--paper)}
.icon-btn svg{width:17px;height:17px}
@media (min-width:900px){.nav-links{-webkit-mask-image:none}}
@media (max-width:640px){.brand-full{display:none}.nav-in{gap:10px}}

.monogram{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;letter-spacing:-.04em;font-size:.95rem;box-shadow:0 6px 24px -10px rgba(20,22,40,.5);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s}
.monogram.is-on{opacity:1;transform:none}

/* ---------- hero ---------- */
.hero{position:relative;min-height:100svh;display:grid;align-items:end;overflow:hidden;padding:110px 0 clamp(28px,5vh,56px)}
.hero-water{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-family:var(--display);font-weight:800;font-size:clamp(7rem,27vw,30rem);letter-spacing:-.07em;line-height:.8;color:var(--ink);opacity:.045;white-space:nowrap;pointer-events:none;user-select:none;will-change:transform}
.hero-grid{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:var(--pad);align-items:end}
.hero-name{font-family:var(--display);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;margin:0 0 1.2rem;color:var(--ink2)}
.hero h1{font-family:var(--display);font-weight:800;letter-spacing:-.055em;line-height:.88;margin:0;font-size:clamp(3.3rem,9.6vw,9.4rem)}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.06em}
.hero h1 .ln>span{display:inline-block}
.hero h1 .dot{color:var(--muted)}
.hero-sub{margin:1.6rem 0 0;font-size:clamp(1.02rem,1.6vw,1.2rem);color:var(--ink2);max-width:42ch}
.hero-sub em{font-family:var(--serif);font-size:1.18em;color:var(--ink)}
.hero-ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:2rem}
.hero-fig{position:relative;margin:0;justify-self:end;width:min(100%,460px);aspect-ratio:429/504}
.hero-fig::before{content:"";position:absolute;inset:8% 6% 0;border-radius:999px 999px 0 0;background:var(--wash)}
.hero-fig img{position:relative;width:100%;height:100%;object-fit:contain;object-position:bottom;filter:grayscale(1) contrast(1.15) brightness(.92);-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 64%);-webkit-mask-size:4px 4px;mask-image:radial-gradient(circle,#000 58%,transparent 64%);mask-size:4px 4px}
:root[data-theme="dark"] .hero-fig img{filter:grayscale(1) invert(.06) contrast(1.05) brightness(1.15)}
.hero-tag{position:absolute;left:-6%;bottom:12%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;font-size:.78rem;line-height:1.35;box-shadow:0 18px 40px -24px rgba(20,22,40,.45)}
.hero-tag b{display:block;font-family:var(--display);font-size:.92rem;letter-spacing:-.01em}
.hero-tag i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (max-width:860px){
  .hero{align-items:start;padding-top:96px}
  .hero-grid{grid-template-columns:1fr}
  .hero-fig{order:-1;justify-self:end;width:min(62vw,300px);margin-bottom:-8px}
  .hero-tag{left:auto;right:58%;bottom:8%}
  .hero-water{top:22%}
}

/* hero load sequence (the one orchestrated moment) */
.js .hero h1 .ln>span{transform:translateY(105%)}
.js .hero-name,.js .hero-sub,.js .hero-ctas,.js .hero-tag{opacity:0;transform:translateY(12px)}
.js .hero-fig{opacity:0;transform:translateY(24px)}
.is-loaded .hero h1 .ln>span{transform:none;transition:transform 1s cubic-bezier(.2,.8,.1,1)}
.is-loaded .hero h1 .ln:nth-child(2)>span{transition-delay:.1s}
.is-loaded .hero-name,.is-loaded .hero-sub,.is-loaded .hero-ctas,.is-loaded .hero-tag,.is-loaded .hero-fig{opacity:1;transform:none;transition:opacity .8s,transform .9s cubic-bezier(.2,.8,.1,1)}
.is-loaded .hero-fig{transition-delay:.25s}
.is-loaded .hero-sub{transition-delay:.45s}
.is-loaded .hero-ctas{transition-delay:.55s}
.is-loaded .hero-tag{transition-delay:.9s}

/* ---------- sections ---------- */
.sec{padding:clamp(80px,12vw,150px) 0 0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:1.2rem 2rem;margin-bottom:clamp(32px,5vw,56px)}
.sec-head .lede{margin:0;max-width:40ch}

/* ---------- about ---------- */
.about-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(32px,6vw,96px);align-items:start}
.about-copy p{margin:0 0 1.1rem;color:var(--ink2);max-width:58ch}
.about-copy p:first-of-type{font-size:clamp(1.12rem,1.6vw,1.3rem);color:var(--ink);line-height:1.5}
.about-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:1.6rem}
.idwrap{display:grid;gap:22px}
.idcard{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:20px;box-shadow:0 30px 60px -40px rgba(20,22,40,.55);transform:rotate(-1.6deg);transition:transform .5s cubic-bezier(.2,.8,.1,1);max-width:420px}
.idcard:hover{transform:rotate(0)}
.idcard::before{content:"";position:absolute;top:-9px;left:50%;width:54px;height:16px;margin-left:-27px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.id-top{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;color:var(--muted);padding-bottom:14px;border-bottom:1px dashed var(--line)}
.id-top b{font-family:var(--display);color:var(--ink);font-size:.82rem;letter-spacing:-.01em}
.id-body{display:grid;grid-template-columns:96px 1fr;gap:16px;padding:16px 0}
.id-photo{width:96px;height:112px;border-radius:var(--r-m);object-fit:cover;background:var(--wash)}
.id-name{font-family:var(--display);font-weight:800;font-size:1.35rem;letter-spacing:-.03em;line-height:1.05;margin:2px 0 4px}
.id-role{font-size:.84rem;color:var(--ink2);margin:0 0 10px;line-height:1.35}
.id-meta{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.74rem;margin:0}
.id-meta dt{color:var(--muted)}.id-meta dd{margin:0;font-weight:500}
.id-foot{display:flex;align-items:end;justify-content:space-between;gap:12px;padding-top:12px;border-top:1px dashed var(--line)}
.barcode{height:30px;flex:1;max-width:190px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px)}
.id-foot small{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;line-height:1.3}
.facts{margin:0;display:grid;border-top:1px solid var(--line)}
.facts div{display:grid;grid-template-columns:120px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.facts dt{color:var(--muted)}.facts dd{margin:0}
.quote{font-family:var(--serif);font-style:italic;font-size:1.5rem;line-height:1.25;margin:0;color:var(--ink)}
@media (max-width:860px){.about-grid{grid-template-columns:1fr}.idcard{transform:rotate(-1deg)}}

/* ---------- skills ---------- */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;font-size:.84rem;border:1px solid var(--line);background:var(--paper);transition:background .2s,color .2s,border-color .2s}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--ink);opacity:.8}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.chip[aria-pressed="true"] i{background:var(--on-ink)}
.skills-grid{display:grid;grid-template-columns:1fr 340px;gap:clamp(20px,3vw,40px);align-items:start}
.ptable{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.el{position:relative;aspect-ratio:1;border-radius:9px;padding:6px 7px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--tb);color:var(--tf);transition:opacity .35s,transform .25s,box-shadow .25s;min-width:0}
.el small{font-size:.58rem;opacity:.7;font-variant-numeric:tabular-nums;line-height:1}
.el strong{font-family:var(--display);font-weight:700;font-size:clamp(1rem,1.9vw,1.55rem);letter-spacing:-.04em;line-height:1}
.el span{font-size:.55rem;line-height:1.1;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.el:hover{transform:translateY(-2px)}
.el.is-dim{opacity:.16}
.el.is-sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink);transform:scale(1.06);z-index:1}
.el[data-tier="6"]{border:1px dashed var(--line)}
.sdetail{position:sticky;top:96px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:24px;min-height:340px}
.sd-big{width:150px;aspect-ratio:1;border-radius:16px;background:var(--ink);color:var(--on-ink);padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:20px}
.sd-big small{font-size:.75rem;opacity:.7;font-variant-numeric:tabular-nums}
.sd-big strong{font-family:var(--display);font-size:4rem;font-weight:800;letter-spacing:-.06em;line-height:.9}
.sd-name{font-family:var(--display);font-weight:800;font-size:1.7rem;letter-spacing:-.03em;margin:0;line-height:1.1}
.sd-cat{font-size:.82rem;color:var(--muted);margin:4px 0 14px}
.sd-note{margin:0 0 14px;color:var(--ink2);font-size:.94rem}
.sd-used{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.sd-used li{font-size:.78rem;padding:4px 10px;border-radius:999px;background:var(--wash)}
.legend{display:flex;align-items:center;gap:10px;margin-top:16px;font-size:.78rem;color:var(--muted)}
.legend i{display:flex;gap:3px}.legend b{display:block;width:14px;height:14px;border-radius:3px}
@media (max-width:1000px){.skills-grid{grid-template-columns:1fr}.sdetail{position:relative;top:0;min-height:0;display:grid;grid-template-columns:110px 1fr;gap:16px;align-items:start}.sd-big{width:110px;margin:0}.sd-big strong{font-size:2.8rem}}
@media (max-width:720px){.ptable{grid-template-columns:repeat(6,1fr);gap:5px}.el span{display:none}.el strong{font-size:1.15rem}}
@media (max-width:420px){.ptable{grid-template-columns:repeat(5,1fr)}}

/* ---------- work ---------- */
.stage{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch}
.pcard{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);display:grid;grid-template-columns:1fr 1fr;overflow:hidden;min-height:540px;box-shadow:0 40px 80px -60px rgba(20,22,40,.6)}
.pcard-copy{padding:clamp(22px,3.4vw,44px);display:flex;flex-direction:column}
.p-meta{display:flex;justify-content:space-between;gap:12px;font-size:.78rem;color:var(--muted);margin-bottom:22px}
.p-meta b{font-family:var(--display);font-size:2.4rem;line-height:.8;color:var(--ink);font-weight:800;letter-spacing:-.05em}
.p-title{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3vw,2.6rem);line-height:1;letter-spacing:-.04em;margin:0 0 6px}
.p-org{font-size:.86rem;color:var(--muted);margin:0 0 16px}
.p-desc{margin:0 0 16px;color:var(--ink2);font-size:.97rem}
.p-points{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:7px}
.p-points li{display:grid;grid-template-columns:18px 1fr;font-size:.9rem;line-height:1.45}
.p-points li::before{content:"";width:7px;height:7px;margin-top:.5em;border-radius:50%;background:var(--ink)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px;padding:0;list-style:none}
.tags li{font-size:.74rem;padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink2)}
.p-actions{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.notes{margin-top:14px;border-top:1px solid var(--line);display:none}
.notes.is-open{display:block}
.notes dl{margin:0}
.notes div{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.86rem}
.notes dt{color:var(--muted)}.notes dd{margin:0}
.pvis{background:var(--wash);position:relative;display:grid;place-items:center;padding:clamp(18px,3vw,40px);overflow:hidden}
.rail{display:flex;gap:8px}
.rail button{writing-mode:vertical-rl;transform:rotate(180deg);justify-content:flex-end;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:16px 10px;font-size:.8rem;display:flex;align-items:center;gap:10px;color:var(--ink2);transition:background .25s,color .25s;white-space:nowrap}
.rail button b{font-family:var(--display);font-weight:700;color:var(--ink)}
.rail button:hover{color:var(--ink)}
.rail button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.rail button[aria-selected="true"] b{color:var(--on-ink)}
.work-ctrl{display:flex;align-items:center;gap:10px;margin-top:16px}
.work-ctrl span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:auto}
.pcard.is-swap{animation:swap .5s cubic-bezier(.2,.8,.1,1)}
@keyframes swap{from{opacity:0;transform:translateX(18px)}}
@media (max-width:1100px){.rail button{padding:14px 8px}.rail button .rl{display:none}}
@media (max-width:860px){.stage{grid-template-columns:1fr}.rail{order:-1;overflow-x:auto;scrollbar-width:none}.rail button{writing-mode:horizontal-tb;transform:none;flex:none;padding:8px 13px;border-radius:999px}.rail button .rl{display:inline}.pcard{grid-template-columns:1fr;min-height:0}.pvis{min-height:280px;order:-1}}

.side{margin-top:28px;display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line)}
.side a{display:block;padding:18px 18px 18px 0;text-decoration:none;border-bottom:1px solid var(--line)}
.side a:not(:last-child){border-right:1px solid var(--line)}
.side a+a{padding-left:18px}
.side b{display:block;font-family:var(--display);font-size:1.1rem;letter-spacing:-.02em}
.side small{color:var(--muted);font-size:.82rem}
.side-label{font-size:.82rem;color:var(--muted);margin:44px 0 0}
@media (max-width:720px){.side{grid-template-columns:1fr}.side a,.side a+a{padding:16px 0;border-right:0!important}}

/* mock visuals */
.mock{width:100%;max-width:400px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 30px 60px -40px rgba(20,22,40,.55);font-size:.76rem}
.mock-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:.7rem;letter-spacing:.04em}
.mock-h b{color:var(--ink);font-family:var(--display);font-size:.82rem;letter-spacing:0}
.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.pill{font-size:.66rem;padding:3px 8px;border-radius:999px;background:var(--wash);white-space:nowrap}
.pill--ok{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill--wait{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill--ink{background:var(--ink);color:var(--on-ink)}
.bars{display:flex;align-items:end;gap:6px;height:64px;margin-top:10px}
.bars i{flex:1;background:var(--ink);border-radius:4px 4px 0 0;opacity:.85}
.bars-l{display:flex;gap:6px;margin-top:5px;color:var(--muted);font-size:.62rem}.bars-l span{flex:1;text-align:center}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:6px 0 14px}
.cells i{aspect-ratio:1;border-radius:3px;background:var(--ink);opacity:.8}
.cells i.x{opacity:1;background:transparent;border:1.5px dashed var(--warn);position:relative}
.cells i.p{opacity:.22}
.meter{height:10px;border-radius:99px;background:var(--wash);overflow:hidden;position:relative}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ink);border-radius:99px}
.meter i.a{width:92%;opacity:.3}.meter i.b{width:99%}
.big2{display:flex;align-items:baseline;gap:8px;font-family:var(--display);font-weight:800;letter-spacing:-.04em;font-size:2.4rem;line-height:1;margin-bottom:10px}
.big2 s{font-size:1.4rem;color:var(--muted);text-decoration-thickness:2px}
.cal{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.cal div{min-height:46px;border-radius:6px;background:var(--wash);padding:4px;font-size:.58rem;line-height:1.15;color:var(--muted)}
.cal div.b{background:var(--ink);color:var(--on-ink)}.cal div.c{background:var(--t4);color:var(--t4f)}
.cal span{display:block;font-weight:600;color:inherit}
.apis{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.vis-svg{width:100%;height:auto;display:block}
.vis-svg .s{stroke:var(--ink);fill:none}
.vis-svg .f{fill:var(--ink)}
.vis-svg .m{fill:var(--muted)}
.vis-svg .w{fill:var(--warn)}

/* ---------- architecture ---------- */
.arch-tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.arch{display:grid;grid-template-columns:1fr 360px;gap:clamp(20px,3vw,40px);align-items:start}
.flow{list-style:none;margin:0;padding:clamp(18px,3vw,32px);background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);display:grid;gap:0;counter-reset:n}
.flow li{position:relative;display:grid}
.flow li:not(:last-child)::after{content:"";justify-self:start;margin-left:27px;width:2px;height:22px;background:repeating-linear-gradient(var(--ink) 0 4px,transparent 4px 8px);opacity:.5}
.flow.is-run li:not(:last-child)::after{animation:flowdash .8s linear infinite}
@keyframes flowdash{to{background-position:0 8px}}
.node{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;text-align:left;padding:10px 14px 10px 10px;border-radius:14px;border:1px solid var(--line);background:var(--bg);transition:background .25s,color .25s,border-color .25s}
.node i{width:36px;height:36px;margin-left:8px;border-radius:10px;background:var(--wash);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:700;font-size:.78rem;font-variant-numeric:tabular-nums}
.node b{display:block;font-family:var(--display);font-size:1.02rem;letter-spacing:-.02em;line-height:1.2}
.node small{display:block;color:var(--muted);font-size:.8rem;line-height:1.3}
.node em{font-style:normal;font-size:.72rem;color:var(--muted)}
.node:hover{border-color:var(--ink)}
.node[aria-pressed="true"]{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.node[aria-pressed="true"] small,.node[aria-pressed="true"] em{color:color-mix(in srgb,var(--on-ink) 70%,transparent)}
.node[aria-pressed="true"] i{background:color-mix(in srgb,var(--on-ink) 16%,transparent)}
.adetail{position:sticky;top:96px;border-top:2px solid var(--ink);padding-top:18px}
.adetail h3{font-family:var(--display);font-size:1.6rem;letter-spacing:-.03em;margin:0 0 4px;line-height:1.1}
.adetail .ctx{font-size:.84rem;color:var(--muted);margin:0 0 18px}
.adetail dl{margin:0}
.adetail dl div{padding:12px 0;border-top:1px solid var(--line)}
.adetail dt{font-size:.78rem;color:var(--muted);margin-bottom:3px}
.adetail dd{margin:0;font-size:.94rem;color:var(--ink2)}
@media (max-width:1000px){.arch{grid-template-columns:1fr}.adetail{position:relative;top:0}}
@media (max-width:600px){.node{grid-template-columns:44px 1fr;gap:10px;padding:10px}.node i{margin-left:0}.node em{grid-column:2;margin-top:-4px}.flow li:not(:last-child)::after{margin-left:27px}}

/* ---------- experience ---------- */
.years{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:clamp(28px,4vw,48px);position:relative}
.years::-webkit-scrollbar{display:none}
.yr{flex:1 0 auto;min-width:96px;padding:0 6px 16px;text-align:left;position:relative;color:var(--muted);transition:color .25s}
.yr b{display:block;font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3vw,2.6rem);letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.yr small{font-size:.74rem;display:block;margin-top:6px;white-space:nowrap}
.yr::after{content:"";position:absolute;left:6px;bottom:-5px;width:9px;height:9px;border-radius:50%;background:var(--bg);border:1.5px solid var(--muted);transition:background .25s,border-color .25s}
.yr[aria-selected="true"]{color:var(--ink)}
.yr[aria-selected="true"]::after{background:var(--ink);border-color:var(--ink)}
.xp{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(24px,5vw,80px)}
.xp-year{font-family:var(--display);font-weight:800;font-size:clamp(5rem,14vw,12rem);line-height:.8;letter-spacing:-.07em;margin:0;color:var(--ink)}
.xp-range{font-size:.88rem;color:var(--muted);margin:16px 0 0}
.xp-kind{display:inline-block;margin-top:12px;font-size:.74rem;padding:4px 10px;border-radius:999px;background:var(--wash)}
.xp-role{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,2.6vw,2.2rem);letter-spacing:-.035em;line-height:1.05;margin:0}
.xp-org{margin:6px 0 14px;font-size:.92rem;color:var(--ink2)}
.xp-org b{font-weight:600;color:var(--ink)}
.xp-sum{margin:0 0 14px;color:var(--ink2)}
.xp ul.pts{margin:0 0 18px;padding:0;list-style:none;display:grid;gap:0}
.xp ul.pts li{padding:10px 0;border-top:1px solid var(--line);font-size:.92rem;line-height:1.5}
.xp-nav{display:flex;gap:8px;margin-top:6px}
.xp-body.is-swap{animation:swap .45s cubic-bezier(.2,.8,.1,1)}
@media (max-width:860px){.xp{grid-template-columns:1fr}}

/* ---------- learning ---------- */
.learn{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(24px,5vw,80px);align-items:start}
.learn .display{font-size:clamp(3rem,8vw,6.6rem)}
.learn .display em{display:block}
.lrows{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:18px 16px;border-bottom:1px solid var(--line);border-radius:0;transition:background .3s,color .3s,border-radius .3s}
.lrow small{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.78rem}
.lrow b{display:block;font-family:var(--display);font-weight:700;font-size:1.08rem;letter-spacing:-.02em;line-height:1.25}
.lrow span{display:block;font-size:.84rem;color:var(--muted)}
.lrow em{font-style:normal;font-size:.8rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.lrow:hover,.lrow:focus-within{background:var(--ink);color:var(--on-ink);border-radius:12px}
.lrow:hover small,.lrow:hover span,.lrow:hover em{color:color-mix(in srgb,var(--on-ink) 70%,transparent)}
@media (max-width:860px){.learn{grid-template-columns:1fr}.lrow{grid-template-columns:34px 1fr;padding:16px 8px}.lrow em{grid-column:2}}

/* ---------- proud ---------- */
.proud{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px var(--pad) 26px;margin:0 calc(var(--pad)*-1);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.pc{scroll-snap-align:start;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:22px;min-height:300px;display:flex;flex-direction:column;box-shadow:0 30px 60px -50px rgba(20,22,40,.6)}
.pc:nth-child(3n+2){background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.pc:nth-child(3n+2) .pc-ctx,.pc:nth-child(3n+2) .pc-org{color:color-mix(in srgb,var(--on-ink) 65%,transparent)}
.pc-org{font-size:.76rem;color:var(--muted);display:flex;justify-content:space-between}
.pc-num{font-family:var(--display);font-weight:800;font-size:clamp(3.3rem,7vw,5.4rem);letter-spacing:-.06em;line-height:.9;margin:auto 0 12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-num small{font-size:.5em;letter-spacing:-.03em}
.pc-what{font-family:var(--display);font-weight:600;font-size:1.06rem;letter-spacing:-.015em;line-height:1.25;margin:0 0 6px}
.pc-ctx{font-size:.82rem;color:var(--muted);margin:0;line-height:1.45}
.proud-hint{font-size:.8rem;color:var(--muted);margin:0}

/* ---------- contact ---------- */
.contact{padding:clamp(100px,14vw,180px) 0 clamp(60px,8vw,100px)}
.contact h2{font-family:var(--display);font-weight:800;letter-spacing:-.055em;line-height:.9;margin:0;font-size:clamp(3rem,10vw,9rem)}
.contact h2 .c2{display:block;color:var(--t4)}
.contact h2 .dot{color:var(--ink)}
.mail{display:inline-block;margin:clamp(28px,4vw,48px) 0 24px;font-family:var(--serif);font-style:italic;font-size:clamp(1.5rem,4vw,2.8rem);text-decoration:none;border-bottom:1px solid var(--line);line-height:1.2;word-break:break-all}
.mail:hover{border-color:var(--ink)}
.c-links{display:flex;flex-wrap:wrap;gap:8px}
.foot{border-top:1px solid var(--line);padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));font-size:.8rem;color:var(--muted)}
.foot .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-left:calc(var(--pad) + 48px)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:999px;font-size:.86rem;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:50;max-width:calc(100vw - 40px)}
.toast.is-on{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .js .hero h1 .ln>span,.js .hero-name,.js .hero-sub,.js .hero-ctas,.js .hero-tag,.js .hero-fig{transform:none;opacity:1}
}

/* ===== v2 additions ===== */
#proud{margin:0}
.proud-stick>.wrap{width:100%}
@media (max-width:860px){.hero-tag{bottom:-2%}}
.hero-fig canvas{position:relative;display:block;width:100%;height:100%;touch-action:pan-y;cursor:crosshair}
.hero-fig.has-canvas img{display:none}
.hero-rot{margin:1.3rem 0 0;font-family:var(--serif);font-style:italic;font-size:clamp(1.35rem,2.5vw,2rem);line-height:1.25;color:var(--muted)}
.rot{display:inline-grid;vertical-align:bottom;overflow:hidden;height:1.3em;color:var(--ink)}
.rot span{grid-area:1/1;white-space:nowrap;transform:translateY(110%);transition:transform .75s cubic-bezier(.2,.8,.1,1)}
.rot span.on{transform:none}.rot span.out{transform:translateY(-110%)}
.js .hero-rot{opacity:0;transform:translateY(12px)}
.is-loaded .hero-rot{opacity:1;transform:none;transition:opacity .8s .35s,transform .9s .35s cubic-bezier(.2,.8,.1,1)}

.marq{overflow:hidden;border-block:1px solid var(--line);padding:clamp(14px,2vw,22px) 0;display:grid;gap:4px;user-select:none;margin-top:clamp(20px,4vw,40px)}
.mrow{display:flex;width:max-content;will-change:transform}
.mrow span{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,4.2vw,3.2rem);letter-spacing:-.045em;line-height:1.15;padding:0 .4em;white-space:nowrap}
.mrow span:nth-child(even){font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--muted)}
.mrow span::after{content:"";display:inline-block;width:.16em;height:.16em;border-radius:50%;background:var(--ink);opacity:.35;margin-left:.8em;vertical-align:.28em}

.js .split .w{display:inline-block;overflow:hidden;vertical-align:top;padding:0 .06em .12em 0;margin-bottom:-.12em}
.js .split .w>span{display:inline-block;transform:translateY(110%);transition:transform 1s cubic-bezier(.2,.8,.1,1);transition-delay:calc(var(--i,0)*70ms)}
.js .split.in .w>span{transform:none}

.js .ptable:not(.done) .el{opacity:0}
.ptable.go .el{animation:pop .7s cubic-bezier(.2,.8,.1,1) both;animation-delay:var(--d)}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.55) rotate(-8deg)}to{opacity:1;transform:none}}

.ai-grid{display:grid;grid-template-columns:1.12fr .88fr;gap:clamp(24px,4vw,64px);align-items:start}
.orch{background:var(--ink);color:var(--on-ink);border-radius:var(--r-l);padding:clamp(16px,2.4vw,26px);position:relative;overflow:hidden;box-shadow:0 40px 80px -50px rgba(20,22,40,.7)}
.orch-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:.76rem;margin-bottom:6px}
.orch-h b{font-family:var(--display);font-size:1rem;letter-spacing:-.01em}
.orch-h span{opacity:.6}
.orch svg{width:100%;height:auto;display:block}
.orch .ln{stroke:currentColor;opacity:.25;fill:none;stroke-width:1.3;stroke-dasharray:3 5}
.orch .nd .bg{fill:color-mix(in srgb,var(--on-ink) 9%,transparent);stroke:currentColor;stroke-opacity:.4;transition:fill .3s}
.orch .nd.hot .bg{fill:color-mix(in srgb,var(--on-ink) 30%,transparent)}
.orch .nd text{fill:currentColor;font-family:var(--display);font-size:11px;font-weight:700;text-anchor:middle;letter-spacing:-.01em}
.orch .nd text.s{font-family:var(--sans);font-weight:400;font-size:9px;opacity:.6;letter-spacing:0}
.orch .pk{fill:currentColor}.orch .pk.bad{fill:var(--warnI)}.orch .pk.ok{fill:var(--okI)}
.log{margin-top:8px;height:138px;overflow:hidden;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.72rem;line-height:1.62;display:flex;flex-direction:column;justify-content:flex-end;-webkit-mask-image:linear-gradient(transparent,#000 45%);mask-image:linear-gradient(transparent,#000 45%)}
.log div{animation:logIn .35s ease both;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.log .ok{color:var(--okI);opacity:1}.log .bad{color:var(--warnI);opacity:1}
@keyframes logIn{from{opacity:0;transform:translateY(8px)}}
.versus{margin-top:14px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-l);padding:14px 18px}
.versus-h{display:flex;justify-content:space-between;font-size:.76rem;color:var(--muted);margin-bottom:4px}
.versus-h b{font-family:var(--display);color:var(--ink);font-size:.95rem}
.vlane{display:grid;grid-template-columns:118px 1fr 58px;gap:12px;align-items:center;padding:10px 0}
.vlane+.vlane{border-top:1px solid var(--line)}
.vlane b{font-family:var(--display);font-size:.9rem;display:block;line-height:1.2}
.vlane small{font-size:.72rem;color:var(--muted);display:block;line-height:1.3}
.vtrack{position:relative;height:30px;border-radius:8px;background:var(--wash);overflow:hidden}
.vtrack i{position:absolute;top:50%;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;background:var(--ink);animation:tick .3s ease both}
.vtrack em{position:absolute;top:50%;transform:translateY(-50%);font-style:normal;font-size:.62rem;line-height:1;padding:4px 7px;border-radius:999px;background:var(--ink);color:var(--on-ink);white-space:nowrap;animation:tick .3s ease both}
.vtrack em.ok{background:var(--good);color:#fff}
.vtrack .vline{position:absolute;top:50%;left:3%;height:2px;margin-top:-1px;background:var(--ink);opacity:.3;width:0;transition:width 4s linear}
.vcount{font-family:var(--display);font-weight:800;font-size:1.5rem;letter-spacing:-.04em;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.vcount small{display:block;font-family:var(--sans);font-weight:400;font-size:.62rem;letter-spacing:0;color:var(--muted);margin-top:3px}
@keyframes tick{from{opacity:0;transform:translateY(-50%) scale(.3)}}
.vtrack i{animation-name:tickd}@keyframes tickd{from{opacity:0;transform:scale(.2)}}
.pillars .lrow{grid-template-columns:44px 1fr;align-items:start}
.pillars .lrow span{margin-top:3px;line-height:1.45}
.pillars .lrow em{grid-column:2;margin-top:4px}
@media (max-width:960px){.ai-grid{grid-template-columns:1fr}}
@media (max-width:520px){.vlane{grid-template-columns:1fr 50px}.vlane>div:first-child{grid-column:1/-1}.orch .nd text.s{display:none}}

.pin-on .proud-stick{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.pin-on .proud{display:flex;overflow:visible;width:max-content;margin:0;padding:10px var(--pad) 16px max(var(--pad),calc((100vw - var(--maxw))/2 + var(--pad)));scroll-snap-type:none;will-change:transform}
.pin-on .pc{flex:none;width:clamp(280px,23vw,330px);min-height:340px;will-change:transform}
.pin-on .proud-hint{display:none}
.proud-bar{display:none;height:2px;background:var(--line);margin-top:26px;position:relative;border-radius:2px;overflow:hidden}
.proud-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);width:0}
.pin-on .proud-bar{display:block}
.pin-on #achievements{padding-top:clamp(40px,6vw,80px)}

.pvis .mock{transition:transform .5s cubic-bezier(.2,.8,.1,1);transform-style:preserve-3d}
.typed{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;border-right:2px solid var(--ink);animation:type 2.6s steps(22) infinite alternate,caret .7s step-end infinite;max-width:22ch}
@keyframes type{0%,15%{width:0}85%,100%{width:22ch}}
@keyframes caret{50%{border-color:transparent}}
.waitp{animation:pulse 1.4s infinite}
.lanes text{font-family:var(--sans);font-size:10px;fill:var(--muted)}
.lanes text.b{font-family:var(--display);font-weight:700;fill:var(--ink);font-size:11px}
@media (prefers-reduced-motion:reduce){.js .split .w>span{transform:none}.js .ptable:not(.done) .el{opacity:1}.js .hero-rot{opacity:1;transform:none}.typed{width:auto;border:0}}

/* ===== v3: under-the-hood reveal ===== */
.hero{touch-action:pan-y}
.hero-under{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.hero-name,.hero h1,.hero-rot,.hero-sub{color:var(--hx);mix-blend-mode:difference}
.hero h1 .dot,.hero-sub em,.rot{color:inherit}
.hero-rot{opacity:.8}
.is-loaded .hero-rot{opacity:.8}
.hero-fig.has-canvas::before{display:none}
.hero-fig canvas{cursor:inherit}
.hero.is-live{cursor:crosshair}
.hero-hint{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);white-space:nowrap;pointer-events:none;transition:opacity .6s,transform .6s}
.hero-hint svg{width:42px;height:14px;overflow:visible}
.hero-hint path{stroke:var(--ink);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-dasharray:60;stroke-dashoffset:60;animation:hintdraw 2.4s cubic-bezier(.6,0,.2,1) infinite}
@keyframes hintdraw{40%,70%{stroke-dashoffset:0}100%{stroke-dashoffset:-60}}
.js .hero-hint{opacity:0}
.is-loaded .hero-hint{opacity:1;transition-delay:1.4s}
.hero-hint.is-gone{opacity:0!important;transform:translate(-50%,8px);transition-delay:0s!important}
@media (max-width:860px){.hero-hint{bottom:calc(10px + env(safe-area-inset-bottom,0px))}}

/* ===== v4: content-driven additions ===== */
.hero-rot .role{color:inherit;font-size:1.12em}
.id-bal{padding:0 0 12px}
.id-bal-h{font-size:.68rem;color:var(--muted);margin-bottom:5px}

:root{

  --red:#FF7B5F; --tape:#E9B93A; --grid:rgba(238,242,248,.06);
  --t1:#EEF2F8; --t2:#C2CBDB; --t3:#8C99B4; --t4:#3F5684; --t5:#26395F; --t1f:#13203B; --t2f:#13203B; --t3f:#13203B; --t4f:#EEF2F8; --t5f:#EEF2F8; --t6f:#EEF2F8;
  --good:#8FD3A6; --warn:#FFB38A; --okI:#2F7A4F; --warnI:#C0562B;}}
:root[data-theme="dark"]{
  --bg:#13203B; --paper:#192A4C; --wash:#1F3359; --line:#2E4674; --ink:#EEF2F8; --ink2:#C2CBDB; --muted:#8C99B4; --on-ink:#13203B;
  --red:#FF7B5F; --tape:#E9B93A; --grid:rgba(238,242,248,.06);

/* ---------- hero ---------- */

.sk-hero .hero-name,.sk-hero h1,.sk-hero .hero-rot,.sk-hero .hero-sub{mix-blend-mode:normal;color:var(--ink)}

.sk-tag{position:absolute;right:max(var(--pad),calc((100vw - var(--maxw))/2 + var(--pad)));bottom:14%;z-index:3;background:var(--note);color:#1C2B4A;padding:14px 16px 12px;font-size:.8rem;line-height:1.35;transform:rotate(3deg);box-shadow:3px 6px 14px -6px rgba(28,43,74,.35);max-width:200px}

        "name": "Payments messaging",
        "context": "Keytrade Bank, 2024 – now",
        "nodes": [
          {
            "title": "Channels",
            "summary": "Retail and corporate banking clients",
            "why": "Every payment starts as a request from a banking channel.",
            "tradeoff": "Strict contracts at the edge keep the rest of the system simple.",
            "stack": "React · TypeScript"

            "title": "Services",
            "summary": "Backend services with typed contracts",
            "why": "Services talk through gRPC and Protobuf, so a contract change is caught at build time, not in production.",

            "stack": "Node.js · gRPC · Protobuf"
          },
          {
            "title": "Message queues",
            "summary": "Work flows through queues, not calls",
            "why": "Queues decouple producers from processors, absorb bursts and let each consumer scale on its own.",
            "tradeoff": "Eventual consistency and idempotency become your job.",
            "stack": "RabbitMQ · Kafka"
          },
          {
            "title": "Payment processors",
            "summary": "Instant, SEPA, SWIFT, direct debits, standing orders",

            "tradeoff": "More paths to operate, but one rail’s trouble stays on that rail.",
            "stack": "Event-driven processing"
          },
          {
            "title": "Failure isolation",
            "summary": "Skip-record breaker and backoff retries",
            "why": "A failing record is isolated and the batch keeps flowing; transient failures retry with exponential backoff.",
            "tradeoff": "Isolated records need their own follow-up. Result: 92% → 99% success.",
            "stack": "Circuit breaker pattern"
          },
          {
            "title": "Observability",
            "summary": "Success metrics and anomaly alerts",
            "why": "Self-triggered success metrics and real-time anomaly detection replace digging through database logs.",

            "stack": "Dynatrace · Elasticsearch"

            "title": "Task",

            "why": "Work enters as an event, so it can be queued, retried and traced like any other job.",

          },
          {
            "title": "Orchestrator",
            "summary": "The master model plans and routes",
            "why": "Planning is separated from doing: one model breaks the job into subtasks and picks a worker for each.",
            "tradeoff": "An extra model call up front, in exchange for better routing and control.",
            "stack": "LLM API · prompt engineering"
          },
          {
            "title": "Workers",
            "summary": "Specialised models execute subtasks",
            "why": "Each subtask goes to the model best suited for it, in parallel where possible.",
            "tradeoff": "More providers and prompts to maintain.",
            "stack": "Multiple LLM APIs"
          },
          {
            "title": "Validation",
            "summary": "The orchestrator checks every result",
            "why": "Results are checked before they are trusted; a failed check sends the subtask back.",
            "tradeoff": "Latency for reliability.",
            "stack": "Typed outputs · retries"
          },
          {
            "title": "Result",
            "summary": "Merged, validated output",
            "why": "Only validated, merged output leaves the system.",
            "stack": "TypeScript"
          }
        ]
      },
      {
        "name": "Durable AI workflow",
        "context": "Side project",
        "nodes": [
          {
            "title": "Event",
            "summary": "Something happens, a function starts",
            "why": "No cron and no polling: the workflow is triggered by an event.",
            "stack": "Inngest event"
          },
          {
            "title": "step.run",
            "summary": "Each step is retried and memoised",
            "why": "If the model call in step 3 fails, steps 1 and 2 don’t run again.",
            "tradeoff": "Code is split into explicit steps.",
            "stack": "Inngest step.run"
          },
          {
            "title": "LLM call",
            "summary": "Slow, flaky, expensive, isolated in a step",
            "why": "The model call gets its own retries and timeout without surrounding glue code.",
            "stack": "LLM API"
          },
          {
            "title": "waitForEvent",
            "summary": "Pause until something happens",
            "why": "Waiting for a human review or a webhook costs nothing: no loop asking “is it done yet?”",
            "tradeoff": "Flow is driven by events, so naming them well matters.",
            "stack": "Inngest step.waitForEvent"
          },
          {
            "title": "Done",
            "summary": "Completion event for whoever needs it",
            "why": "Downstream systems react to the finished event instead of polling for status.",
            "stack": "Event-driven"
          }
        ]
      },

   '<div class="xp-nav"><button class="icon-btn" type="button" data-xp="-1" aria-label="Newer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button><button class="icon-btn" type="button" data-xp="1" aria-label="Older">'+ARROW+'</button></div></div>';
  if(!RM){$('.xp-body',xp).classList.add('is-swap');var yEl=$('#xpYear');yEl.animate&&yEl.animate([{transform:'translateY(40%)',opacity:0},{transform:'none',opacity:1}],{duration:700,easing:'cubic-bezier(.2,.8,.1,1)'})}
  var sel=yrs.children[xi];if(sel)yrs.scrollTo({left:sel.offsetLeft-yrs.clientWidth/3,behavior:'smooth'});
}
xp.addEventListener('click',function(e){var b=e.target.closest('[data-xp]');if(b)showXp(xi+(+b.dataset.xp))});
showXp(0);
})()}

/* ================= LEARNING ================= */
if(CONTENT.learning){$('#lrows').innerHTML=(CONTENT.learning.items||[]).map(function(l,i){return '<li class="lrow" tabindex="0"><small>'+pad(i+1)+'</small><div><b>'+esc(l.title)+'</b><span>'+esc(l.detail||'')+'</span></div><em>'+esc(l.when||'')+'</em></li>'}).join('')}

/* ================= ACHIEVEMENTS (pinned horizontal) ================= */
var proud=$('#proud'),pinWrap=$('#proudPin'),pbar=$('#pbar'),pinDist=0,cards=[];
function pinUpdate(){if(!proud||!root.classList.contains('pin-on'))return;var r=pinWrap.getBoundingClientRect(),span=pinWrap.offsetHeight-window.innerHeight,p=span>0?Math.min(1,Math.max(0,-r.top/span)):0;
  proud.style.transform='translate3d('+(-p*pinDist)+'px,0,0)';pbar.style.width=(p*100)+'%';
  var vw=window.innerWidth;cards.forEach(function(c){var b=c.getBoundingClientRect(),k=((b.left+b.width/2)/vw-.5);c.style.transform='translateY('+(Math.abs(k)*26)+'px) rotate('+(k*5)+'deg)'})}
function pinSetup(){if(!proud)return;var on=!RM&&window.innerWidth>=900&&cards.length>3;root.classList.toggle('pin-on',on);
  if(!on){pinWrap.style.height='';proud.style.transform='';cards.forEach(function(c){c.style.transform=''});return}
  pinDist=Math.max(0,proud.scrollWidth-window.innerWidth);pinWrap.style.height=(window.innerHeight+pinDist)+'px';pinUpdate()}
if(proud&&CONTENT.achievements){
  var AC=CONTENT.achievements;$('#proudHint').textContent=AC.hint||'';
  proud.innerHTML=(AC.items||[]).map(function(p,i){var num=p.big?'<span>'+esc(p.big)+'</span>':(p.prefix?'<small>'+esc(p.prefix)+'</small>':'')+'<span data-n="'+(+p.value||0)+'">'+(RM?(+p.value||0):0)+'</span>'+esc(p.suffix||'');
    return '<article class="pc"><div class="pc-org"><span>'+esc(p.org||'')+'</span><span>'+pad(i+1)+'</span></div><p class="pc-num" aria-label="'+esc(p.big||((p.prefix||'')+p.value+(p.suffix||'')))+'">'+num+'</p><p class="pc-what">'+esc(p.title)+'</p><p class="pc-ctx">'+esc(p.detail||'')+'</p></article>'}).join('');
  cards=$$('.pc',proud);
  var countUp=function(el){var to=+el.dataset.n,t0=null,d=1100;function f(t){if(!t0)t0=t;var k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)}requestAnimationFrame(f)};
  if(!RM&&'IntersectionObserver' in window){var cio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){countUp(e.target);cio.unobserve(e.target)}})},{threshold:.6});$$('[data-n]',proud).forEach(function(el){cio.observe(el)})}
  else{$$('[data-n]',proud).forEach(function(el){el.textContent=el.dataset.n})}
  var pt2;window.addEventListener('resize',function(){clearTimeout(pt2);pt2=setTimeout(pinSetup,150)});
}else proud=null;

/* ================= FILE SAVING ================= */
var toast=$('#toast'),tt;
function say(m){toast.textContent=m;toast.classList.add('is-on');clearTimeout(tt);tt=setTimeout(function(){toast.classList.remove('is-on')},2800)}
function b64bytes(b){var bin=atob(b),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}
function blobSave(name,data,type){var url=URL.createObjectURL(new Blob([data],{type:type}));var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},4000)}
function saveFile(name,data,type,done){
  var c=window.claude;
  if(!c||typeof c.use!=='function'){blobSave(name,data,type);if(done)done();return}
  c.use('downloads').then(function(dl){
    if(!dl){blobSave(name,data,type);if(done)done();return}
    return dl.save({filename:name,data:data}).then(function(){say('Saved '+name);if(done)done()},function(err){var code=err&&err.code;if(code==='declined')return;if(code==='rate_limited'){say('A save prompt is already open');return}say('Saving isn’t available here.')});
  },function(){blobSave(name,data,type)});
}
$$('[data-resume]').forEach(function(b){b.addEventListener('click',function(){
  try{saveFile(P.resumeFilename||'resume.pdf',b64bytes(ASSETS.cv),'application/pdf')}catch(e){if(P.email)location.href='mailto:'+P.email}
})});

/* ================= EDITOR (#edit) ================= */
function exportHtml(obj,cb){
  var json=JSON.stringify(obj,null,2).replace(/<\//g,'<\\/');
  function swap(src){var open='<script type="application/json" id="cv-content">',i=src.indexOf(open);if(i<0)return null;var j=src.indexOf('</'+'script>',i);
    var out=src.slice(0,i+open.length)+json+src.slice(j);var m=obj.meta||{};
    if(m.title)out=out.replace(/<title>[\s\S]*?<\/title>/,'<title>'+esc(m.title)+'</title>');
    if(m.description)out=out.replace(/<meta name="description" content="[^"]*">/,'<meta name="description" content="'+esc(m.description)+'">');
    return out}
  var fallback=function(){cb(swap(PRISTINE))};
  if(/^https?:/.test(location.protocol)&&window.fetch){fetch(location.href.split('#')[0],{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){var o=t&&t.indexOf('id="cv-content"')>0?swap(t):null;if(o)cb(o);else fallback()},fallback)}else fallback();
}
function openEditor(){
  if($('#cvEditor'))return;
  var d=document.createElement('aside');d.id='cvEditor';d.className='editor';d.setAttribute('aria-label','Content editor');
  d.innerHTML='<div class="ed-h"><b>Edit content</b><button class="icon-btn" type="button" data-ed="close" aria-label="Close editor">×</button></div>'+
   '<p class="ed-help">Everything on the page comes from this JSON. Edit, press <b>Preview</b> to see it, then <b>Download index.html</b> and upload that file to your host. Delete a section’s key to hide it.</p>'+
   '<textarea spellcheck="false" aria-label="Site content JSON"></textarea>'+
   '<p class="ed-status" role="status"></p>'+
   '<div class="ed-bar"><button class="btn btn--ink" type="button" data-ed="preview">Preview</button><button class="btn" type="button" data-ed="download">Download index.html</button><button class="btn" type="button" data-ed="copy">Copy JSON</button><button class="btn" type="button" data-ed="reset">Discard draft</button></div>';
  document.body.appendChild(d);root.classList.add('editing');
  var ta=$('textarea',d),st=$('.ed-status',d);
  ta.value=JSON.stringify(CONTENT,null,2);
  function check(){try{var o=JSON.parse(ta.value);st.className='ed-status ok';st.textContent=DRAFT?'Valid JSON. Previewing an unsaved draft.':'Valid JSON.';return o}catch(e){st.className='ed-status err';st.textContent='JSON error: '+e.message;return null}}
  check();ta.addEventListener('input',check);
  ta.addEventListener('keydown',function(e){if(e.key==='Tab'){e.preventDefault();var s=ta.selectionStart;ta.setRangeText('  ',s,ta.selectionEnd,'end')}});
  d.addEventListener('click',function(e){var b=e.target.closest('[data-ed]');if(!b)return;var a=b.dataset.ed,o;
    if(a==='close'){d.remove();root.classList.remove('editing');history.replaceState(null,'',location.pathname+location.search.replace(/[?&]edit\b/,''));return}
    if(a==='reset'){try{sessionStorage.removeItem('cv-draft')}catch(x){}location.reload();return}
    o=check();if(!o)return;
    if(a==='preview'){try{sessionStorage.setItem('cv-draft',JSON.stringify(o))}catch(x){}location.reload()}
    if(a==='copy'){(navigator.clipboard?navigator.clipboard.writeText(JSON.stringify(o,null,2)):Promise.reject()).then(function(){say('JSON copied')},function(){ta.select();say('Select all and copy')})}
    if(a==='download'){exportHtml(o,function(html){if(!html){say('Could not build the file.');return}saveFile('index.html',html,'text/html')})}
  });
}
if(EDIT)openEditor();
window.addEventListener('hashchange',function(){if(/edit\b/.test(location.hash))openEditor()});

/* ================= LOAD ================= */
function go(){requestAnimationFrame(function(){root.classList.add('is-loaded');pinSetup();onScroll()})}
if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,new Promise(function(r){setTimeout(r,900)})]).then(go)}else go();
onScroll();
})();
</script>
